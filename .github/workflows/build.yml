name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Uses v4 to avoid Node.js deprecation warnings
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: artemsbulgakov/buildozer-action@v1
        env:
          # Fixes 'invalid user' and permission errors
          USER: root
          PIP_BREAK_SYSTEM_PACKAGES: 1
          # Prevents build failure due to 'org.test' domain
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: 1
          # Bypasses the security warning for running as root
          BUILDOZER_WARN_ON_ROOT: 0
        with:
          # The 'yes y |' prefix automatically answers 'yes' to all prompts
          command: yes y | buildozer android debug
          workdir: .
          buildozer_version: master

      - name: Upload APK
        # Uses v4 to fix the 'deprecated version' error
        uses: actions/upload-artifact@v4
        with:
          name: JosephApp-APK
          path: bin/*.apk
