[app]
title = JosephApp
package.name = josephapp
package.domain = org.test
source.dir = .

# Must include 'pt' extension for the YOLO model file
source.include_exts = py, png, jpg, kv, atlas, pt

# Patterns can be used to explicitly include the model file
source.include_patterns = yolov8n.pt

version = 0.1

# FIXED: Use 'opencv' instead of 'opencv-python'. 
# Note: YOLOv8 requires many dependencies; listing the core ones is safer.
requirements = python3, kivy==2.3.0, opencv, numpy, ultralytics, pillow

orientation = portrait
fullscreen = 0

# Android 13+ (API 33) requires these.
android.permissions = CAMERA, INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE
android.api = 33
android.minapi = 21

[buildozer]
log_level = 2
warn_on_root = 1
